name: Playloud CI

on:
  push:
    branches:
      - feat/playloud-foundation-client
  pull_request:
    branches:
      - main

jobs:
  domain-tests:
    name: Domain tests (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore tests/Playloud.Domain.Tests/Playloud.Domain.Tests.csproj

      - name: Run xUnit executable probe
        run: dotnet run --project tests/Playloud.Domain.Tests/Playloud.Domain.Tests.csproj -c Release --no-restore

      - name: Test through dotnet test
        run: dotnet test tests/Playloud.Domain.Tests/Playloud.Domain.Tests.csproj -c Release --no-restore
