name: Playloud CI

on:
  push:
    branches:
      - feat/playloud-foundation-client
  pull_request:
    branches:
      - main

jobs:
  windows-build-and-tests:
    name: Build + tests (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore Playloud.sln

      - name: Build solution
        run: dotnet build Playloud.sln -c Release --no-restore

      - name: Test solution
        run: dotnet test Playloud.sln -c Release --no-build --no-restore
