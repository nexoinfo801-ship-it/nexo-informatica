name: Playloud CI

on:
  push:
    branches:
      - feat/playloud-foundation-client
  pull_request:
    branches:
      - main

jobs:
  windows-build-and-tests:
    name: Build + tests (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pinned .NET SDK
        id: dotnet_sdk
        shell: pwsh
        run: |
          $required = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          $installed = @()

          if ($null -ne $dotnet) {
            $installed = @(dotnet --list-sdks | ForEach-Object { ($_ -split '\s+')[0] })
          }

          $needsSetup = -not ($installed -contains $required)
          "required=$required" >> $env:GITHUB_OUTPUT
          "needs_setup=$($needsSetup.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Required SDK: $required"
          Write-Host "Installed SDKs: $($installed -join ', ')"
          Write-Host "Needs setup: $needsSetup"

      - name: Setup pinned .NET SDK when missing
        if: steps.dotnet_sdk.outputs.needs_setup == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet_sdk.outputs.required }}

      - name: Show SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore Playloud.sln

      - name: Build solution
        run: dotnet build Playloud.sln -c Release --no-restore

      - name: Test solution
        run: dotnet test Playloud.sln -c Release --no-build --no-restore
