name: NEXO Gateway CI

on:
  push:
    branches: [nexo-gateway-prep, nexo-commercial-hardening-r3]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo_ci_password
          POSTGRES_DB: nexo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexo -d nexo_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://nexo:nexo_ci_password@127.0.0.1:5432/nexo_ci
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gateway/package.json
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check server.mjs && node --check hub.mjs && node --check hub_store.mjs
      - name: Test gateway + mobile + Postgres persistence
        run: npm test
